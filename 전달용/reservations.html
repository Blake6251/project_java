<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예약 — COSTOOL</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div class="dev-banner">
    <strong>COSTOOL SaaS 0.3.0-beta · 개발 진행 중</strong>
    <span>예약 슬롯 UI 시연</span>
  </div>
  <nav class="nav">
    <a class="brand" href="./index.html"><img src="./assets/logo.png" alt="COSTOOL" /></a>
    <div class="nav-links">
      <a href="./index.html">홈</a>
      <a href="./products.html">상품</a>
      <a class="active" href="./reservations.html">예약</a>
      <a href="./roadmap.html">개발현황</a>
    </div>
    <div class="nav-spacer"></div>
    <a class="btn btn-primary" href="./login.html">로그인</a>
  </nav>

  <main class="page">
    <section class="section" style="margin-top:1rem">
      <h2>예약</h2>
      <p class="lead">상담·방문·설치 슬롯을 웹에서 받는 화면 프로토타입입니다.</p>

      <div class="grid-2">
        <form class="panel form-stack" id="reserveForm">
          <label>리소스
            <select id="resource">
              <option>상담실 A</option>
              <option>데모 부스 B</option>
              <option>기술 지원 슬롯</option>
              <option>출장 방문팀</option>
            </select>
          </label>
          <label>날짜
            <input type="date" id="date" />
          </label>
          <div>
            <div style="margin-bottom:8px;font-weight:600">시간 슬롯</div>
            <div class="slot-grid" id="slots"></div>
          </div>
          <label>요청 메모
            <textarea rows="3" placeholder="방문 목적, 인원 등"></textarea>
          </label>
          <button class="btn btn-primary" type="submit" id="submitBtn" disabled>예약 신청 (데모)</button>
          <div class="wip-note" id="result" style="display:none">
            데모 접수만 표시했습니다. 실제 DB 저장·확정 메일은 개발 중입니다.
          </div>
        </form>

        <aside class="panel">
          <span class="badge">예정 기능</span>
          <h3>예약 모듈 로드맵</h3>
          <p style="margin-top:8px">
            · 리소스별 가용 시간 자동 계산<br />
            · 중복 예약 방지·대기열<br />
            · 예약금 결제 / 노쇼 처리<br />
            · 관리자 캘린더 뷰
          </p>
        </aside>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner"><span>COSTOOL</span><span>전달용 프로토타입</span></div>
  </footer>

  <script>
    const slots = [
      { t: "10:00", ok: true },
      { t: "11:00", ok: true },
      { t: "13:00", ok: false },
      { t: "14:00", ok: true },
      { t: "15:30", ok: true },
      { t: "16:30", ok: false },
      { t: "17:00", ok: true }
    ];
    let selected = null;
    const box = document.getElementById("slots");
    const btn = document.getElementById("submitBtn");
    box.innerHTML = slots.map((s, i) =>
      `<button type="button" class="slot ${s.ok ? "" : "disabled"}" data-i="${i}" ${s.ok ? "" : "disabled"}>${s.t}</button>`
    ).join("");
    box.addEventListener("click", (e) => {
      const el = e.target.closest(".slot");
      if (!el || el.disabled) return;
      box.querySelectorAll(".slot").forEach((x) => x.classList.remove("selected"));
      el.classList.add("selected");
      selected = el.dataset.i;
      btn.disabled = false;
    });
    const d = new Date(); d.setDate(d.getDate() + 1);
    document.getElementById("date").value = d.toISOString().slice(0, 10);
    document.getElementById("reserveForm").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("result").style.display = "block";
    });
  </script>
</body>
</html>
